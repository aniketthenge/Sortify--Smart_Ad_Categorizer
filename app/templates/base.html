<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ad Categorizer{% endblock %} · Lokmat Times</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">AC</span> Ad Categorizer <small>for lokmattimes.com</small></div>
  <nav>
    {% set p = request.path %}
    <a href="{{ url_for('dashboard') }}" class="{{ 'active' if p == '/' }}">Dashboard</a>
    <a href="{{ url_for('ads') }}" class="{{ 'active' if p.startswith('/ads') }}">Ads</a>
    <a href="{{ url_for('classify') }}" class="{{ 'active' if p.startswith('/classify') }}">Classify</a>
    <a href="{{ url_for('model_page') }}" class="{{ 'active' if p.startswith('/model') }}">Model</a>
  </nav>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
<footer class="foot">Ads collected from public pages of lokmattimes.com via headless browser · Hybrid TF-IDF + Logistic Regression + keyword rules</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
